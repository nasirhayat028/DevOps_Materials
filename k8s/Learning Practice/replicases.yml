apiVersion: v1
kind: ReplicationController
metadata:
  name: my-resume
spec:
  replicas: 3
  selector:
    app: resume-app  # The controller looks for this label
  template:
    metadata:
      labels:
        app: resume-app  # The Pod is tagged with this label
    spec:
      containers:
      - name: text-resume
        image: nasirhayat028/resume

